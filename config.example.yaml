# Copy this file to config.yaml and set what ARIA should use.

# --- The assistant you talk to -------------------------------------------
provider: gemini          # cerebras | gemini | groq | nvidia | openrouter | openai | mistral | zai | ollama
model: gemini-2.5-flash
persona: jarvis           # ARIA's personality (see src/aria/prompts.py)

# --- Providers ------------------------------------------------------------
# Every OpenAI-compatible provider needs base_url plus separate keys for ARIA
# and the coder. The keys themselves live in .env (never in this file).
# Each provider keeps its own model list; /models shows it, /model switches.
providers:
  cerebras:
    aria_api_key_env: ARIA_CEREBRAS_API_KEY
    coder_api_key_env: CODER_CEREBRAS_API_KEY
    base_url: https://api.cerebras.ai/v1
    models: [qwen-3.8-27b, gpt-oss-120b]
  gemini:
    aria_api_key_env: ARIA_GEMINI_API_KEY
    coder_api_key_env: CODER_GEMINI_API_KEY
    base_url: https://generativelanguage.googleapis.com/v1beta/openai/
    models: [gemini-2.5-flash, gemini-2.5-pro]
  groq:
    aria_api_key_env: ARIA_GROQ_API_KEY
    coder_api_key_env: CODER_GROQ_API_KEY
    base_url: https://api.groq.com/openai/v1
    models: [llama-3.1-8b-instant, openai/gpt-oss-120b]
  nvidia:
    aria_api_key_env: ARIA_NVIDIA_API_KEY
    coder_api_key_env: CODER_NVIDIA_API_KEY
    base_url: https://integrate.api.nvidia.com/v1
    models: [meta/llama-3.3-70b-instruct]
  openrouter:
    aria_api_key_env: ARIA_OPENROUTER_API_KEY
    coder_api_key_env: CODER_OPENROUTER_API_KEY
    base_url: https://openrouter.ai/api/v1
    models: [anthropic/claude-sonnet-4.5, openai/gpt-4.1-mini]
  openai:
    aria_api_key_env: ARIA_OPENAI_API_KEY
    coder_api_key_env: CODER_OPENAI_API_KEY
    base_url: https://api.openai.com/v1
    models: [gpt-4.1, gpt-4.1-mini]
  mistral:
    aria_api_key_env: ARIA_MISTRAL_API_KEY
    coder_api_key_env: CODER_MISTRAL_API_KEY
    base_url: https://api.mistral.ai/v1
    models: [mistral-large-latest, mistral-small-latest, codestral-latest]
  zai:
    aria_api_key_env: ARIA_ZAI_API_KEY
    coder_api_key_env: CODER_ZAI_API_KEY
    base_url: https://api.z.ai/api/paas/v4
    models: [glm-4.7, glm-4.6, glm-4.7-flash, glm-4.5-air]
  ollama:
    host: http://127.0.0.1:11434
    # Most Ollama models do not support native tools; ARIA's custom
    # <tool_call> protocol is used by default. Set true only when supported.
    native_tools: false
    models: [gemma2:9b, qwen2.5-coder:7b]

# --- The independent coding agent -----------------------------------------
# ARIA deploys it via the deploy_coder tool. It runs with its own memory,
# its own model session, and a much higher iteration budget so massive
# multi-file operations don't bloat ARIA's conversational context.
coder:
  provider: ollama        # optional; defaults to ARIA's provider above
  model: qwen2.5-coder:7b # optional; defaults to ARIA's model above
  max_iterations: 60      # coding agent gets a far bigger budget than ARIA
  max_output_chars: 12000 # per-command output cap inside deployments

# --- Browser automation (ARIA only) --------------------------------------
# Playwright uses a persistent Chromium profile. Run `playwright install chromium`
# after syncing dependencies. This is intentionally opt-in because cookies,
# downloads, uploads, and form actions can affect real accounts.
browser:
  enabled: false
  headless: false
  profile_directory: data/browser-profile
  executable_path: ""       # optional system Chromium path
  timeout_ms: 15000
  max_text_chars: 30000
  wait_until: domcontentloaded
  viewport_width: 1440
  viewport_height: 900
  launch_args: []

# --- Hyprland desktop control (ARIA only) -------------------------------
# managed validates dispatchers and only launches named commands below.
# unrestricted additionally exposes raw hyprctl dispatch, marked keybind
# editing, and desktop_shell. Use only when you explicitly accept full local
# desktop control.
desktop:
  enabled: true
  mode: managed             # managed | unrestricted
  input_backend: arch       # arch (wtype/ydotool/grim) | pyautogui
  hyprctl_command: hyprctl
  wtype_command: wtype
  ydotool_command: ydotool
  screenshot_command: grim
  hyprland_config_path: "" # required only for desktop_set_keybind
  command_timeout_seconds: 15
  launchers:
    terminal: [kitty]
    browser: [firefox, zen]

# --- Web search (local SearXNG) ------------------------------------------
# Start the bundled deployment from infrastructure/searxng with:
#   docker compose up -d
# start_backend: opt-in — when true, ARIA may run that docker compose command
# itself (with a 30 s probe) when SearXNG is unreachable at startup. When
# false (default), startup never touches Docker and continues without web
# search, printing a warning with the recovery command.
# Webpage fetching blocks private/local destinations by default. Add exact
# hostnames only when you intentionally need an internal source.
web:
  enabled: true
  start_backend: false
  searxng_url: http://127.0.0.1:8080
  search_timeout: 10
  page_timeout: 15
  max_results: 5
  max_search_calls: 4
  max_page_fetches: 8
  max_total_web_calls: 12
  max_page_chars: 30000
  max_snippet_chars: 2000
  max_concurrent_page_fetches: 3
  max_retries: 2
  search_cache_ttl: 300
  page_cache_ttl: 1800
  allowed_hosts: []
  user_agent: ARIA/1.0

# The user's tasks, projects, goals, habits, calendar, journal, health, gym,
# finance, and more. Requires LIFEOS_API_KEY in .env; left unconfigured ARIA
# simply answers "not configured" instead of failing.
lifeos:
  enabled: true
  base_url: ""             # e.g. http://127.0.0.1:5000
  api_key_env: LIFEOS_API_KEY
  timeout_seconds: 15
  max_retries: 1           # extra attempts on 5xx/network errors
  retry_backoff_seconds: 0.4

# --- Proactive work and autonomy ------------------------------------------
# Background work is in-process: it runs only while ARIA is open. Every
# scheduled action is written to scheduler.sqlite3 before/after execution.
# Keep autonomy disabled until you have reviewed the category allowlist.


autonomy:
  enabled: false
  allowed_categories: []   # analysis | lifeos_writes | notifications | computer_control | timers
  lifeos_write_operations: [] # explicit operation names, e.g. [create_task]

background:
  enabled: true
  provider: null            # dedicated provider; null disables model analysis
  model: null
  api_key_env: ""          # optional hosted-provider key override
  profile_path: data/proactive-profile.json
  max_output_chars: 8000


notifications:
  enabled: true
  backend: notify-send     # Dunst normally receives notify-send messages; dbus is also supported
  notify_send_command: notify-send
  dbus_command: gdbus
  app_name: ARIA
  default_urgency: normal
  default_timeout_ms: 10000
  tts_enabled: true

scheduler:
  enabled: true
  analysis_enabled: true              # read-only briefings/checks do not require autonomy
  database: data/scheduler/scheduler.sqlite3
  workflow_directory: workflows
  poll_seconds: 15
  default_workflows: true
  timezone: system
  default_misfire_policy: skip # skip | run_once
  briefing_times: ["08:00", "13:00", "18:00"]
  deadline_check_minutes: 30
  goal_check_minutes: 120
  calendar_check_minutes: 60
  briefing_web_queries: ["Weather in Bolton", "Latest AI News", "XAUUSD Market news including news that may affect price of Gold"]   # e.g. ["weather in my city", "technology news about ..."]

# Images are ephemeral by default. Native image models receive image parts;
# otherwise ARIA sends them to the configured visual fallback for a textual
# description. Periodic screen context is deliberately opt-in.
vision:
  enabled: true
  fallback_provider: null
  fallback_model: null
  fallback_api_key_env: ""
  max_image_bytes: 10485760
  clipboard_backend: auto   # auto | wl-paste | xclip | python
  screenshot_command: grim
  retain_images: false
  periodic_screen_enabled: false
  periodic_screen_cron: "*/15 * * * *"

# --- Speech (text-to-speech) ----------------------------------------------
# Choose kokoro_hf for Hugging Face-hosted inference or kokoro_local for the
# local KPipeline backend. Install --extra voice or --extra voice-local.
# chatterbox runs locally for custom voice cloning.
speech:
  enabled: false          # /tts on|off at runtime
  engine: kokoro_hf      # kokoro_hf | kokoro_local | chatterbox
  voice: af_sarah         # Kokoro voice, or an audio path for chatterbox
  speed: 1.0
  lang_code: a            # Kokoro language code ('a' = American English)
  hf_api_key_env: HF_TOKEN
  hf_model: hexgrad/Kokoro-82M
  hf_provider: auto       # or a specific inference provider (novita, fal-ai, ...)

# --- Logging ---------------------------------------------------------------
# aria.log contains all levels (DEBUG through CRITICAL) in one rotating file.
logging:
  directory: data/logs
  console_level: WARNING
  max_bytes: 5242880      # 5 MiB per file before rotation
  backup_count: 3

# --- Hybrid memory (SQLite + Chroma RAG) ------------------------------------
# SQLite stores what ARIA needs to know exactly (facts, preferences, projects,
# goals, tasks + a memory registry and event log). Chroma stores what ARIA may
# want to remember semantically (conversation, episodic, knowledge, project
# context collections under data/memory/chroma). Chroma is required.
#
# Retrieval is query-aware: structured questions hit SQLite, historical
# questions hit Chroma, and hybrid questions combine both. Results are ranked
# by similarity/importance/confidence/recency/access and injected into the
# system prompt as a delimited <assistant_memory> block (treated as context,
# never as instructions).
#
# The optional OpenAI-compatible endpoint is tried first. If it is absent or
# unavailable, ARIA tries the Ollama models below in order. Install Ollama and
# pull at least one model before starting ARIA:
#   ollama pull qwen3-embedding:0.6b
memory:
  enabled: true
  directory: data/memory              # SQLite lives at <directory>/assistant.db
  chroma_directory: data/memory/chroma
  embedding_base_url: ""              # optional OpenAI-compatible embeddings URL
  embedding_model: ""                 # optional model at that URL
  embedding_api_key_env: MEMORY_EMBEDDING_API_KEY
  embedding_ollama_host: http://127.0.0.1:11434
  embedding_fallback_models:
    - qwen3-embedding:0.6b
    - nomic-embed-text
    - mxbai-embed-large
    - bge-m3
    - snowflake-arctic-embed
  # Retrieval (spec: query-aware, token-bounded)
  context_token_budget: 4000          # approx max words of injected memory
  # Ranking weights (configurable per deployment)
  rank_similarity: 0.25
  rank_recency: 0.15
  rank_frequency: 0.10
  rank_importance: 0.35
  rank_confidence: 0.15
  # Lifecycle: decay/expiry of low-value memories; confirmed and important
  # memories are never auto-deleted purely for age. 0 days = never expires.
  episodic_retention_days: 180
  conversation_retention_days: 365
  knowledge_retention_days: 0

# --- YAML autonomous workflows --------------------------------------------
# Put additional workflows in workflows/*.yaml. See workflows/README.md.
# Example:
# workflows:
#   - name: create_followup_task
#     cron: "0 17 * * 1-5"
#     category: lifeos_writes
#     action:
#       type: lifeos_write
#       operation: create_task
#       arguments: {title: "Review today's follow-ups"}
#     misfire_policy: skip

# --- Workspace & limits ----------------------------------------------------
# All paths are resolved from the directory where aria starts.
# Runtime changes made with /provider, /model, /workspace, /iterations, /agent,
# /tts and /trace are saved separately in data/state/aria-state.yaml.
workspace: .

# --- UI --------------------------------------------------------------------
# backend: urwid (modern TUI, install --extra tui) or rich (legacy full-screen)
# show_cot: live execution trace (tool calls/results) while ARIA works
# keep_cot: also keep the finished execution trace in the transcript
ui:
  backend: urwid
  show_cot: true
  keep_cot: false

# --- Skills ----------------------------------------------------------------
# Drop Markdown files into skills/ (created on first run) to shape ARIA's
# behavior, personality, and workflows. Files are re-read every turn; front-
# matter name/priority is optional. See skills/README.md.

# The conversational loop stops after this many model/tool rounds as an emergency guard.
max_iterations: 20

# Leave these null for no subprocess timeout/output truncation.
command_timeout_seconds: null
max_command_output_chars: null
